<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Collector & Sharer</title>
    <link rel="stylesheet" href="popup.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <header>
            <div class="header-top">
                <h1>URL Collector & Sharer</h1>
                <span id="url-count" class="badge">0</span>
            </div>

            <div class="controls-grid">
                <div class="toggle-row">
                    <label class="switch">
                        <input type="checkbox" id="toggle-collection">
                        <span class="slider round"></span>
                    </label>
                    <span>Auto Collection</span>
                </div>
                <div class="toggle-row">
                    <label class="switch">
                        <input type="checkbox" id="toggle-button">
                        <span class="slider round"></span>
                    </label>
                    <span>Floating Button</span>
                </div>
            </div>

            <button id="btn-collect-tabs" class="primary-btn full-width">
                Collect All Tabs
            </button>
        </header>

        <main id="url-list" class="url-list">
            <!-- Items injected here -->
            <div class="empty-state">No URLs collected yet</div>
        </main>

        <div class="bottom-area">
            <div class="partial-divider"></div>
            <div class="share-section">
                <span class="share-label">Share:</span>
                <div class="share-buttons">
                    <button id="btn-share-wa" class="share-btn wa-btn" title="Share on WhatsApp">
                        <svg viewBox="0 0 448 512" width="18" height="18" fill="currentColor">
                            <path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7 .9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/>
                        </svg>
                    </button>
                    <button id="btn-share-tg" class="share-btn tg-btn" title="Share on Telegram">
                        <svg viewBox="0 0 496 512" width="18" height="18" fill="currentColor">
                            <path d="M248 8C111 8 0 119 0 256S111 504 248 504 496 393 496 256 385 8 248 8zM363 176.7c-3.7 39.2-19.9 134.4-28.1 178.3-3.5 18.6-10.3 24.8-16.9 25.4-14.4 1.3-25.3-9.5-39.3-18.7-21.8-14.3-34.2-23.2-55.3-37.2-24.5-16.1-8.6-25 5.3-39.5 3.7-3.8 67.1-61.5 68.3-66.7 .2-.7 .3-3.1-1.2-4.4s-3.6-.8-5.1-.5q-3.3 .7-104.6 69.1-14.8 10.2-26.9 9.9c-8.9-.2-25.9-5-38.6-9.1-15.5-5-27.9-7.7-26.8-16.3q.8-6.7 18.5-13.7 108.4-47.2 144.6-62.3c68.9-28.6 83.2-33.6 92.5-33.8 2.1 0 6.6 .5 9.6 2.9a10.5 10.5 0 0 1 3.5 6.7A43.8 43.8 0 0 1 363 176.7z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Modals -->
            <div id="modal-export" class="modal hidden">
                <div class="modal-content">
                    <h3>Export Format</h3>
                    <div class="modal-buttons">
                        <button class="primary-btn" data-format="json">JSON</button>
                        <button class="primary-btn" data-format="csv">CSV</button>
                        <button class="primary-btn" data-format="txt">TXT</button>
                    </div>
                    <button class="text-btn close-modal">Cancel</button>
                </div>
            </div>

            <div id="modal-open" class="modal hidden">
                <div class="modal-content">
                    <h3>Open Mode</h3>
                    <div class="modal-buttons">
                        <button class="primary-btn" data-mode="new">New Window</button>
                        <button class="primary-btn" data-mode="current">Current Window</button>
                        <button class="primary-btn" data-mode="incognito">Incognito</button>
                    </div>
                    <button class="text-btn close-modal">Cancel</button>
                </div>
            </div>

            <footer>
                <div class="actions-row">
                    <button id="btn-select-all" class="secondary-btn">Select All</button>
                    <button id="btn-delete" class="danger-btn">Delete</button>
                </div>
                <div class="actions-row">
                    <button id="btn-copy" class="action-icon tooltip-container" aria-label="Copy">
                        <svg viewBox="0 0 448 512" width="16" height="16" fill="currentColor"><path d="M320 448v40c0 13.255-10.745 24-24 24H24c-13.255 0-24-10.745-24-24V120c0-13.255 10.745-24 24-24h72v296c0 30.879 25.121 56 56 56h168zm0-344V0H152c-13.255 0-24 10.745-24 24v368c0 13.255 10.745 24 24 24h272c13.255 0 24-10.745 24-24V128H344c-13.2 0-24-10.8-24-24zm120.971-31.029L375.029 7.029A24 24 0 0 0 358.059 0H352v96h96v-6.059a24 24 0 0 0-7.029-16.97z"/></svg>
                        <span class="tooltip-text">Copy Links</span>
                    </button>
                    <button id="btn-export" class="action-icon tooltip-container" aria-label="Export">
                        <svg viewBox="0 0 512 512" width="16" height="16" fill="currentColor"><path d="M216 0h80c13.3 0 24 10.7 24 24v168h87.7c17.8 0 26.7 21.5 14.1 34.1L269.7 378.3c-7.5 7.5-19.8 7.5-27.3 0L90.1 226.1c-12.6-12.6-3.7-34.1 14.1-34.1H192V24c0-13.3 10.7-24 24-24zm296 376v112c0 13.3-10.7 24-24 24H24c-13.3 0-24-10.7-24-24V376c0-13.3 10.7-24 24-24h146.7l49 49c20.1 20.1 52.5 20.1 72.6 0l49-49H488c13.3 0 24 10.7 24 24zm-124 88c0-11-9-20-20-20s-20 9-20 20 9 20 20 20 20-9 20-20zm64 0c0-11-9-20-20-20s-20 9-20 20 9 20 20 20 20-9 20-20z"/></svg>
                        <span class="tooltip-text">Export</span>
                    </button>
                    <button id="btn-import-trigger" class="action-icon tooltip-container" aria-label="Import">
                        <svg viewBox="0 0 512 512" width="16" height="16" fill="currentColor"><path d="M296 384h-80c-13.3 0-24-10.7-24-24V192H104.3c-17.8 0-26.7-21.5-14.1-34.1L242.3 5.7c7.5-7.5 19.8-7.5 27.3 0l152.2 152.2c12.6 12.6 3.7 34.1-14.1 34.1H320v168c0 13.3-10.7 24-24 24zm216-8v112c0 13.3-10.7 24-24 24H24c-13.3 0-24-10.7-24-24V376c0-13.3 10.7-24 24-24h136v8c0 30.9 25.1 56 56 56h80c30.9 0 56-25.1 56-56v-8h136c13.3 0 24 10.7 24 24zm-124 88c0-11-9-20-20-20s-20 9-20 20 9 20 20 20 20-9 20-20zm64 0c0-11-9-20-20-20s-20 9-20 20 9 20 20 20 20-9 20-20z"/></svg>
                        <span class="tooltip-text">Import</span>
                    </button>
                    <!-- Hidden input for file handling -->
                    <input type="file" id="file-import" accept=".json,.csv,.txt" style="display:none">
                    <button id="btn-open" class="action-icon tooltip-container" aria-label="Open Selected">
                        <svg viewBox="0 0 512 512" width="16" height="16" fill="currentColor"><path d="M432,320H400a16,16,0,0,0-16,16V448H64V128H208a16,16,0,0,0,16-16V80a16,16,0,0,0-16-16H48A48,48,0,0,0,0,112V464a48,48,0,0,0,48,48H400a48,48,0,0,0,48-48V336A16,16,0,0,0,432,320ZM488,0h-128c-21.37,0-32.05,25.91-17,41l35.73,35.73L135,320.37a24,24,0,0,0,0,34L157.67,377a24,24,0,0,0,34,0L435.28,133.32,471,169c15,15,41,4.5,41-17V24A24,24,0,0,0,488,0Z"/></svg>
                        <span class="tooltip-text">Open Links</span>
                    </button>
                </div>
            </footer>
        </div>
        </div>
    </div>
    <script src="../utils.js"></script>
    <script src="popup.js"></script>
</body>

</html>
