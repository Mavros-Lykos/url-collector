<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Collector & Sharer</title>
    <link rel="stylesheet" href="popup.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <header>
            <div class="header-top">
                <h1>URL Collector & Sharer</h1>
                <span id="url-count" class="badge">0</span>
            </div>

            <div class="controls-grid">
                <div class="toggle-row">
                    <label class="switch">
                        <input type="checkbox" id="toggle-collection">
                        <span class="slider round"></span>
                    </label>
                    <span>Auto Collection</span>
                </div>
                <div class="toggle-row">
                    <label class="switch">
                        <input type="checkbox" id="toggle-button">
                        <span class="slider round"></span>
                    </label>
                    <span>Floating Button</span>
                </div>
            </div>

            <button id="btn-collect-tabs" class="primary-btn full-width">
                Collect All Tabs
            </button>
        </header>

        <main id="url-list" class="url-list">
            <!-- Items injected here -->
            <div class="empty-state">No URLs collected yet</div>
        </main>

        <div class="bottom-area">
            <div class="partial-divider"></div>
            <div class="share-section">
                <span class="share-label">Share:</span>
                <div class="share-buttons">
                    <button id="btn-share-wa" class="share-btn wa-btn" title="Share on WhatsApp">
                        <svg viewBox="0 0 448 512" width="18" height="18" fill="currentColor">
                            <path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7 .9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Modals -->
            <div id="modal-export" class="modal hidden">
                <div class="modal-content">
                    <h3>Export Format</h3>
                    <div class="modal-buttons">
                        <button class="primary-btn" data-format="json">JSON</button>
                        <button class="primary-btn" data-format="csv">CSV</button>
                        <button class="primary-btn" data-format="txt">TXT</button>
                    </div>
                    <button class="text-btn close-modal">Cancel</button>
                </div>
            </div>

            <div id="modal-open" class="modal hidden">
                <div class="modal-content">
                    <h3>Open Mode</h3>
                    <div class="modal-buttons">
                        <button class="primary-btn" data-mode="new">New Window</button>
                        <button class="primary-btn" data-mode="current">Current Window</button>
                        <button class="primary-btn" data-mode="incognito">Incognito</button>
                    </div>
                    <button class="text-btn close-modal">Cancel</button>
                </div>
            </div>

            <footer>
                <div class="actions-row">
                    <button id="btn-select-all" class="secondary-btn">Select All</button>
                    <button id="btn-delete" class="danger-btn">Delete</button>
                </div>
                <div class="actions-row">
                    <button id="btn-copy" class="action-icon" title="Copy">📋</button>
                    <button id="btn-export" class="action-icon" title="Export">💾</button>
                    <button id="btn-import-trigger" class="action-icon" title="Import">📂</button>
                    <!-- Hidden input for file handling -->
                    <input type="file" id="file-import" accept=".json,.csv,.txt" style="display:none">
                    <button id="btn-open" class="action-icon" title="Open Selected">↗️</button>
                </div>
            </footer>
        </div>
        </div>
    </div>
    <script src="../utils.js"></script>
    <script src="popup.js"></script>
</body>

</html>
