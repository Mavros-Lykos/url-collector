name: Build Extension ZIP

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    tags:
      - 'v*' # Also trigger automatically when you push a new version tag!

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Create ZIP file
        run: |
          zip -r url-collector-ext.zip . -x "*.git*" "*.github*" "*.DS_Store*" "*.zip" "Privacy_Justifications.txt"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: url-collector-zip
          path: url-collector-ext.zip
