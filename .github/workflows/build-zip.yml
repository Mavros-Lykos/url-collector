name: Build Extension ZIP

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create ZIP file
        run: |
          ZIP_NAME="url-collector-${{ github.ref_name }}.zip"
          zip -r "$ZIP_NAME" . \
            -x "*.git*" "*.github*" "*.DS_Store*" "*.zip" "Privacy_Justifications.txt"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: url-collector-${{ github.ref_name }}
          path: url-collector-${{ github.ref_name }}.zip
          